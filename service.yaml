apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: assistec-now
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/launch-stage: GA
    spec:
      containers:
      - image: assistec-now
        ports:
        - name: http1
          containerPort: 3000
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
      serviceAccountName: firebase-provisioning-sa
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '20'
